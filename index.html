<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 주변 편의점 음료 행사 찾기</title>
<style>
body{font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;margin:0;background:#f5f6f8;color:#222}
header{background:#2b59c3;color:#fff;padding:14px 18px}header h1{margin:0;font-size:20px}header small{opacity:.85}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.row b{min-width:80px}
.chip{border:1px solid #ccd;border-radius:16px;padding:5px 11px;cursor:pointer;background:#fff;font-size:14px}
.chip.on{background:#2b59c3;color:#fff;border-color:#2b59c3}
input[type=text]{padding:6px;border:1px solid #ccd;border-radius:6px;min-width:220px}
button.act{padding:6px 12px;border:0;border-radius:6px;background:#2b59c3;color:#fff;cursor:pointer}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.item{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px #0001;font-size:14px}
.item img{width:100%;height:150px;object-fit:contain;background:#fafafa}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;color:#fff;font-size:12px;margin-right:4px}
.CU{background:#7b2c8f}.GS25{background:#0a6cbf}.\37-Eleven,.b7{background:#00843d}.emart24{background:#f5a300}
.promo{background:#e33}.near{color:#555;font-size:12px;margin-top:4px}.warn{background:#fff4e0;border-left:4px solid #f5a300;padding:8px;font-size:13px}
.gift{color:#b05;font-size:12px}ul.stores{margin:4px 0;padding-left:18px;font-size:13px}
*,*::before,*::after{box-sizing:border-box}html,body{overflow-x:hidden}
.row>span[id^=f]{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 220px;min-width:0}
.chip{display:inline-flex;align-items:center;justify-content:center;height:32px;line-height:1;white-space:nowrap;margin:0}
button.act,select{height:34px;font-size:14px}select{padding:0 8px;border:1px solid #ccd;border-radius:6px;background:#fff}
input[type=text]{height:34px;font-size:16px}label{display:inline-flex;align-items:center;gap:4px;font-size:14px}
@media(max-width:600px){.row b{min-width:0;flex:0 0 100%}input[type=text]{min-width:0;flex:1 1 160px}label{margin-left:0!important;flex:1 1 100%}#q{flex:1 1 100%}main{padding:8px}}
</style></head><body>
<header><h1>🥤 내 주변 편의점 음료 행사 찾기</h1><small id="upd"></small></header>
<main>
<div class="card"><div class="row"><b>📍 내 위치</b><button class="act" id="geo">현재 위치 사용</button>
<input type="text" id="addr" placeholder="주소 또는 위도,경도 (예: 37.5665,126.9780)"><button class="act" id="addrBtn">검색</button>
<select id="radius"><option value="500">500m</option><option value="1000" selected>1km</option><option value="2000">2km</option></select><select id="preset"><option value="">지역 바로 선택…</option><option value="37.5663,126.9779">서울시청</option><option value="37.4979,127.0276">강남역</option><option value="37.5572,126.9245">홍대입구역</option><option value="37.5133,127.1001">잠실역</option><option value="37.5216,126.9243">여의도역</option><option value="37.5446,127.056">성수역</option><option value="37.5551,126.9368">신촌역</option><option value="37.5404,127.0692">건대입구역</option><option value="37.5714,126.9918">종로3가</option><option value="37.5927,127.0164">성신여대입구역</option><option value="37.2664,127.0001">수원역</option><option value="37.4563,126.7052">인천시청</option><option value="35.1578,129.06">부산 서면</option><option value="35.8693,128.5956">대구 동성로</option><option value="36.3326,127.4342">대전역</option><option value="35.1475,126.9156">광주 충장로</option></select></div>
<div id="locMsg" class="near">위치를 설정하면 가까운 CU·GS25·세븐일레븐·이마트24 매장을 보여드려요. (OpenStreetMap 데이터, 전국 매장 내장)</div>
<ul class="stores" id="storeList"></ul></div>
<div class="card">
<div class="row"><b>음료 장르</b><span id="fGenre"></span></div>
<div class="row"><b>가격대</b><span id="fPrice"></span></div>
<div class="row"><b>행사 유형</b><span id="fPromo"></span></div>
<div class="row"><b>브랜드</b><span id="fChain"></span></div>
<div class="row"><b>굿즈/증정</b><label><input type="checkbox" id="giftOnly"> 증정·굿즈 정보 있는 상품만</label>
<label style="margin-left:12px"><input type="checkbox" id="nearOnly"> 주변에 매장 있는 브랜드만</label>
<input type="text" id="q" placeholder="상품명 검색"></div>
<div id="status" class="warn"></div></div>
<div class="row"><b id="count"></b><button class="act" id="resetBtn" type="button">초기화</button> <select id="sort"><option value="price">가격 낮은순</option><option value="name">이름순</option><option value="dist">가까운 매장순</option></select></div>
<div id="grid"></div>
</main>
<script src="data.js"></script>
<script>
const CH=["CU","GS25","7-Eleven","emart24"],CHK={"CU":"CU","GS25":"GS25","7-Eleven":"세븐일레븐","emart24":"이마트24"};
const GENRES=["커피","탄산","주스","차","에너지/이온","우유/두유","생수","곡물/기타","주류","기타"];
const PRICES=[["~1,500원",0,1500],["1,500~2,500원",1501,2500],["2,500~4,000원",2501,4000],["4,000~10,000원",4001,10000],["10,000원~",10001,1e9]];
const PROMOS=["1+1","2+1","3+1","할인","골라담기","덤증정"];
const S={genre:new Set(),price:new Set(),promo:new Set(),chain:new Set()};let stores=[],DATA={items:[],status:{}};
function chips(id,list,key,label=x=>x){const el=document.getElementById(id);list.forEach((v,i)=>{const b=document.createElement("span");b.className="chip";b.textContent=label(v);b.dataset.v=typeof v=="string"?v:i;b.onclick=()=>{const k=b.dataset.v;S[key].has(k)?S[key].delete(k):S[key].add(k);b.classList.toggle("on");render()};el.appendChild(b)})}
function hav(a,b,c,d){const R=6371000,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function chainOf(t){const s=((t.brand||"")+" "+(t.name||"")+" "+(t["brand:en"]||"")+" "+(t["name:en"]||"")).toLowerCase();
 if(/\bcu\b|씨유/.test(s))return"CU";if(/gs25|gs 25|지에스/.test(s))return"GS25";if(/7-?eleven|세븐일레븐|seven/.test(s))return"7-Eleven";if(/emart24|이마트24|이마트 24/.test(s))return"emart24";return null}
const CHI=["CU","GS25","7-Eleven","emart24",null];let ALL=null,LAST=null;
function setMsg(t){document.getElementById("locMsg").textContent=t}
async function getAll(){if(ALL)return ALL;const r=await fetch("stores.json");if(!r.ok)throw new Error("stores.json "+r.status);const j=await r.json();ALL=j.s;return ALL}
async function liveStores(lat,lon,rad){const q=`[out:json][timeout:10];nwr["shop"="convenience"](around:${rad},${lat},${lon});out center tags;`;
 for(const u of["https://overpass-api.de/api/interpreter","https://overpass.private.coffee/api/interpreter"]){try{const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),8000);const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(q),signal:ac.signal});clearTimeout(tm);if(!r.ok)continue;const j=await r.json();
  return j.elements.map(e=>{const t=e.tags||{};return[CHI.indexOf(chainOf(t)),e.lat??e.center?.lat,e.lon??e.center?.lon,t.name||""]})}catch(e){}}return null}
async function loadStores(lat,lon,label){LAST=[lat,lon,label];const rad=+document.getElementById("radius").value;setMsg("주변 매장 검색 중…");
 let arr=null,src="저장된 OSM 데이터";try{arr=await getAll()}catch(e){arr=await liveStores(lat,lon,rad);src="실시간 OSM"}
 if(!arr){setMsg("매장 데이터를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.");stores=[];render();return}
 const dl=rad/111000*1.2,dn=dl/Math.cos(lat*Math.PI/180);
 const all=arr.filter(s=>Math.abs(s[1]-lat)<dl&&Math.abs(s[2]-lon)<dn).map(s=>{const c=CHI[s[0]]??null;return{chain:c,name:s[3]||(c?CHK[c]:"편의점"),d:Math.round(hav(lat,lon,s[1],s[2]))}}).filter(s=>s.d<=rad).sort((a,b)=>a.d-b.d);
 stores=all.filter(s=>s.chain);const oth=all.length-stores.length;
 setMsg(`${label?label+" · ":""}반경 ${rad}m 안에 4대 편의점 ${stores.length}곳${oth?` (기타 편의점 ${oth}곳)`:""} · ${src} 기준, 일부 누락 가능`);
 document.getElementById("storeList").innerHTML=all.slice(0,15).map(s=>`<li>${s.chain?`<span class="badge ${s.chain=="7-Eleven"?"b7":s.chain}">${CHK[s.chain]}</span>`:`<span class="badge" style="background:#888">기타</span>`}${s.name} · ${s.d}m</li>`).join("")||"<li>반경 안에 매장이 없어요. 반경을 넓혀 보세요.</li>";
 render()}
document.getElementById("radius").onchange=()=>{if(LAST)loadStores(...LAST)};
const GEOERR={1:"위치 권한이 거부됐어요. 주소창 왼쪽 자물쇠(ⓘ) → 권한 → 위치를 '허용'으로 바꾸거나, 아래에 주소를 입력하세요.",2:"현재 위치를 확인할 수 없어요(GPS/네트워크 위치 꺼짐). 휴대폰 설정에서 '위치'를 켜거나 주소를 입력하세요.",3:"위치 확인 시간이 초과됐어요. 실내라면 잠시 후 다시 시도하거나 주소를 입력하세요."};
document.getElementById("geo").onclick=()=>{if(!navigator.geolocation){setMsg("이 브라우저는 위치 기능을 지원하지 않아요. 주소를 입력하세요.");return}
 if(!window.isSecureContext){setMsg("보안(https) 주소에서만 위치를 쓸 수 있어요. https:// 주소로 접속해 주세요.");return}
 setMsg("현재 위치 확인 중… (최대 20초)");const ok=p=>loadStores(p.coords.latitude,p.coords.longitude,`현재 위치(±${Math.round(p.coords.accuracy)}m)`);
 navigator.geolocation.getCurrentPosition(ok,e=>{if(e.code==1){setMsg(GEOERR[1]);return}setMsg("정밀 위치 실패 → 대략적 위치로 다시 시도 중…");
  navigator.geolocation.getCurrentPosition(ok,e2=>setMsg((GEOERR[e2.code]||"위치 확인 실패")+" (코드 "+e2.code+")"),{enableHighAccuracy:false,timeout:15000,maximumAge:600000})},
 {enableHighAccuracy:true,timeout:8000,maximumAge:60000})};
async function geocode(v){const tries=[];const q=/서울|부산|대구|인천|광주|대전|울산|세종|경기|강원|충|전|경|제주|시|도\s/.test(v)?v:v;
 const nom=s=>fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=kr&accept-language=ko&limit=1&q="+encodeURIComponent(s)).then(r=>r.ok?r.json():[]).then(j=>j[0]&&[+j[0].lat,+j[0].lon,j[0].display_name.split(",").slice(0,3).join(",")]);
 const pho=s=>fetch("https://photon.komoot.io/api/?limit=1&lat=37.5665&lon=126.978&q="+encodeURIComponent(s)).then(r=>r.ok?r.json():{features:[]}).then(j=>{const f=j.features[0];if(!f)return null;const p=f.properties;return[f.geometry.coordinates[1],f.geometry.coordinates[0],[p.name,p.district,p.city].filter(Boolean).join(", ")]});
 const s2=v.replace(/(로|길)\s*(\d+[가-힣]*길)/,"$1$2").replace(/\s+\d+(-\d+)?\s*$/,"");
 for(const f of[()=>nom(v),()=>pho(v),()=>nom(s2),()=>pho(s2),()=>nom("서울 "+s2)]){try{const r=await f();if(r)return r}catch(e){}}return null}
document.getElementById("addrBtn").onclick=async()=>{const v=addr.value.trim();if(!v)return;const m=v.match(/^\s*(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)\s*$/);if(m)return loadStores(+m[1],+m[2],"입력 좌표");
 setMsg("주소 찾는 중…");const g=await geocode(v);if(!g){setMsg("주소를 찾지 못했어요. 도로명(예: 아리랑로19길) 또는 동 이름, 역 이름으로 입력하거나 아래 지역을 선택하세요.");return}loadStores(g[0],g[1],"📍 "+g[2])};
addr.onkeydown=e=>{if(e.key=="Enter")addrBtn.click()};
document.getElementById("preset").onchange=e=>{const v=e.target.value;if(!v)return;const[a,b]=v.split(",");loadStores(+a,+b,e.target.selectedOptions[0].text)};
function render(){const q=document.getElementById("q").value.trim(),go=giftOnly.checked,no=nearOnly.checked;const near={};stores.forEach(s=>(near[s.chain]=near[s.chain]||[]).push(s));
 let r=DATA.items.filter(x=>(!S.genre.size||S.genre.has(x.genre))&&(!S.promo.size||S.promo.has(x.promo))&&(!S.chain.size||S.chain.has(x.chain))
  &&(!S.price.size||[...S.price].some(i=>x.price!=null&&x.price>=PRICES[i][1]&&x.price<=PRICES[i][2]))&&(!go||x.gift)&&(!no||near[x.chain])&&(!q||x.name.includes(q)));
 const so=sort.value;r.sort(so=="name"?(a,b)=>a.name.localeCompare(b.name):so=="dist"?(a,b)=>((near[a.chain]||[{d:1e9}])[0].d-(near[b.chain]||[{d:1e9}])[0].d)||(a.price-b.price):(a,b)=>(a.price??1e9)-(b.price??1e9));
 count.textContent=`검색 결과 ${r.length}개`+(r.length>300?" (상위 300개 표시)":"");
 grid.innerHTML=r.slice(0,300).map(x=>{const n=(near[x.chain]||[]).slice(0,3);return`<div class="item" data-chain="${x.chain}" data-genre="${x.genre}" data-promo="${x.promo}" data-price="${x.price}">${x.image?`<img loading="lazy" src="${x.image}" alt="" onerror="this.style.display='none'">`:""}
 <div><span class="badge ${x.chain=="7-Eleven"?"b7":x.chain}">${CHK[x.chain]}</span><span class="badge promo">${x.promo}</span><span style="font-size:12px;color:#777">${x.genre}</span></div>
 <div style="margin:4px 0"><b>${x.name}</b></div><div>${x.price!=null?x.price.toLocaleString()+"원":"가격 정보 없음"}</div>${x.gift?`<div class="gift">🎁 ${x.gift}</div>`:""}
 <div class="near">${n.length?"📍 가까운 매장: "+n.map(s=>`${s.name}(${s.d}m)`).join(", "):(stores.length?"주변에 이 브랜드 매장 없음":"위치 설정 시 주변 매장 표시")}</div></div>`}).join("")}
function init(){DATA=window.DRINK_DATA||DATA;upd.textContent="행사 데이터 수집: "+(DATA.updated||"-")+" · 전국 공통 행사이며 매장별 재고는 보장되지 않습니다";
document.getElementById("status").innerHTML=CH.map(c=>{const s=DATA.status[c];return s&&s.ok?`✅ ${CHK[c]} ${s.count}개${s.note?" ("+s.note+")":""}`:`⚠️ ${CHK[c]}: 수집 실패${s&&s.error?" – "+s.error:""}`}).join("<br>")+"<br>※ 증정/굿즈 정보는 공식 페이지에 표기된 경우만 표시됩니다.";
 chips("fGenre",GENRES,"genre");chips("fPrice",PRICES,"price",p=>p[0]);chips("fPromo",PROMOS,"promo");chips("fChain",CH,"chain",c=>CHK[c]);
 resetBtn.onclick=()=>{Object.values(S).forEach(s=>s.clear());document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on"));q.value="";giftOnly.checked=false;nearOnly.checked=false;sort.selectedIndex=0;render()};
 [giftOnly,nearOnly,sort].forEach(e=>e.onchange=render);q.oninput=render;render()}
if(!window.DRINK_DATA){fetch("data.json").then(r=>r.json()).then(d=>{window.DRINK_DATA=d;init()}).catch(()=>init())}else init();
</script></body></html>
