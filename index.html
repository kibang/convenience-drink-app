<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="식사코스">
<title>식사 · 식후 · 산책 코스</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
:root{color-scheme:light;--pad:16px;--gap:12px;--radius:16px;--ink:#1c1c1c;--muted:#3d4744;--green:#1f4e46;--line:#e2e8e6}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#e5e7eb;color:#1a1a1a;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
.app{width:100%;max-width:480px;min-height:100dvh;margin:0 auto;background:#f7f7f8;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:40;background:#fff;color:#1a1a1a;padding-top:env(safe-area-inset-top);border-bottom:1px solid #e5e7eb}
header{padding:12px var(--pad) 8px}
header h1{margin:0;font-size:22px;line-height:1.35;font-weight:700;color:#1a1a1a}
header p{margin:4px 0 8px;font-size:14px;line-height:1.5;color:#3f3f46}
#openLog{min-height:44px;padding:8px 16px;border:1px solid #e5e7eb;border-radius:999px;background:#f4f4f5;color:#1a1a1a;font-size:15px;font-weight:600}
.steps{display:flex;gap:8px;overflow-x:auto;min-width:0;max-width:100%;margin:0;padding:0 var(--pad) 12px;background:#fff}
.steps[hidden],.dock[hidden]{display:none!important}
.steps button{flex:0 0 auto;min-height:44px;border-radius:999px;border:0;background:#f4f4f5;color:#1a1a1a;padding:8px 12px;font-size:15px;font-weight:600}
.steps button.on{background:#15803d;color:#fff}
.steps button:disabled{opacity:.45}
main{flex:1;display:flex;flex-direction:column;gap:var(--gap);padding:var(--pad);padding-bottom:var(--pad)}
.app.has-dock main{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
section{display:flex;flex-direction:column;gap:var(--gap)}
section[hidden]{display:none!important}
.card{background:#fff;border-radius:var(--radius);padding:var(--pad);margin:0;box-shadow:0 1px 2px #00000014}
h2{font-size:20px;line-height:1.4;margin:0 0 12px}
h3{font-size:17px;line-height:1.4;margin:16px 0 8px}
.card h3:first-child,.place h3{margin-top:0}
.lead{font-size:16px;line-height:1.5;margin:0 0 12px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}
.choices button{min-height:88px;padding:16px 12px;border-radius:var(--radius);border:1px solid #e5e7eb;background:#fff;color:#1a1a1a;font-size:18px;font-weight:700;line-height:1.4}
.act,.ghost{min-height:48px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;padding:12px 16px}
.act{display:block;width:100%;border:0;background:#15803d;color:#fff}
.ghost{border:1px solid #d4d4d8;background:#fff;color:#1a1a1a}
.btn-row{display:flex;gap:8px}
.btn-row .ghost{flex:1}
.row{display:flex;flex-direction:column;align-items:stretch;gap:8px}
input[type=text],select,textarea{width:100%;max-width:100%;min-height:44px;font-size:16px;line-height:1.5;border:1px solid #ccd;border-radius:12px;padding:8px 12px;background:#fff}
textarea.logbox{min-height:120px;font-size:15px}
.section-label{font-size:18px;line-height:1.4;margin:4px 0 0;padding:0}
.map-frame{height:240px;border-radius:var(--radius);background:#f4f4f5}
#map{height:240px;width:100%;background:#f4f4f5}
.leaflet-container,.leaflet-container *{box-sizing:content-box}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-bar a{width:36px;height:36px;line-height:36px}
.leaflet-control-attribution{font-size:11px;line-height:1.4;max-width:calc(100% - 8px);white-space:normal;background:rgba(255,255,255,.94)}
.map-attr{font-size:14px;line-height:1.5;color:#3f3f46;margin:8px 0 0}
.place{border:2px solid transparent}
.meta,.note,.addr{margin:8px 0 0;font-size:15px;line-height:1.5;color:#3f3f46}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{display:inline-flex;align-items:center;min-height:28px;border-radius:8px;padding:4px 8px;font-size:13px;line-height:1.4;margin:0}
.open{background:#e5f6ea;color:#146c2e}
.closed{background:#fde8e8;color:#8d1d1d}
.unknown{background:#fff4e0;color:#7a4b00}
.est{background:#eef3ff;color:#1a3e8a}
.warn{background:#fff4e0;border-left:4px solid #e0a100;padding:12px;font-size:15px;line-height:1.5;border-radius:12px}
#rainBanner .act{margin-top:8px}
.drink{font-size:15px;line-height:1.5;padding:12px 0;border-top:1px solid var(--line)}
.drink:first-of-type{border-top:0}
a{color:#1a4fbf}
:focus-visible{outline:3px solid #1a3e8a;outline-offset:2px}
.pin-wrap{background:transparent;border:0}
.pin{display:block;width:16px;height:16px;margin:3px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #222}
.pin.visited{opacity:.4;filter:grayscale(1)}
.place.visited{opacity:.5;filter:grayscale(.85)}
.visit,.known-menu{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;line-height:1.5}
.menu-row{display:flex;gap:8px;align-items:center;margin-top:8px}
.menu-row input{flex:1;min-width:0}
.menu-row .ghost{flex:0 0 auto;min-width:72px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:44px;background:#e7f0ee;border-radius:999px;padding:4px 4px 4px 12px;font-size:15px}
.chip button{border:0;background:transparent;min-width:44px;min-height:44px;font-size:18px;cursor:pointer}
.list,#afterList,#logList{display:flex;flex-direction:column;gap:var(--gap)}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(480px,100%);background:#fff;border-top:1px solid #e5e7eb;padding:8px var(--pad) calc(8px + env(safe-area-inset-bottom))}
details.more{margin-top:8px}
details.more summary{min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:600;cursor:pointer;color:#1a1a1a}
.linkish{min-height:44px;padding:0;border:0;background:transparent;color:#15803d;font-size:15px;font-weight:700}
#shareUrl{font-size:15px}
</style>
</head>
<body>
<div class="app">
<div class="topbar">
<header>
<h1>식사 · 식후 · 산책</h1>
<p>상암은 조사 자료, 그 밖은 지도.</p>
<button type="button" id="openLog">내 기록</button>
</header>
<nav id="steps" class="steps" hidden aria-label="단계"></nav>
</div>
<main>
<section id="step-party">
<div class="card">
<h2>몇 명이서 드실 건가요?</h2>
<p class="lead">인원을 먼저 골라 주세요.</p>
<div class="choices" id="partyChoices">
<button type="button" data-party="1">1명 (혼밥)</button>
<button type="button" data-party="2">2명</button>
<button type="button" data-party="3-4">3~4명</button>
<button type="button" data-party="5+">5명 이상</button>
</div>
</div>
</section>
<section id="step-log" hidden>
<div class="card">
<h2>내 기록</h2>
<label class="visit"><input type="checkbox" class="hide-visited"> 가본 곳 숨기기</label>
<p class="note">이 브라우저에만 저장됩니다. OSM 묶음에는 장소 번호가 없어, 그 장소는 좌표와 이름으로 구분합니다.</p>
<div id="logList"></div>
<h3>내보내기 · 가져오기</h3>
<div class="btn-row">
<button type="button" class="ghost" id="exportBtn">내보내기</button>
<button type="button" class="ghost" id="importBtn">가져오기</button>
</div>
<textarea id="transferJson" class="logbox" aria-label="기록 JSON"></textarea>
<p id="transferMsg" class="note" role="status"></p>
</div>
</section>
<section id="step-place" hidden>
<div class="card">
<h2>어디서 시작할까요?</h2>
<p id="originLabel" class="lead"></p>
<div class="row">
<button type="button" class="act" id="geo">내 위치로</button>
<input type="text" id="addr" placeholder="주소 또는 위도,경도" aria-label="주소 또는 좌표">
<button type="button" class="act" id="addrBtn">검색</button>
</div>
<div class="row">
<select id="preset" aria-label="지역 바로 선택"><option value="">지역 바로 선택…</option><option value="37.5795,126.889">누리꿈스퀘어</option><option value="37.5663,126.9779">서울시청</option><option value="37.4979,127.0276">강남역</option><option value="37.5572,126.9245">홍대입구역</option><option value="37.5133,127.1001">잠실역</option><option value="37.5216,126.9243">여의도역</option><option value="37.5446,127.056">성수역</option><option value="37.5551,126.9368">신촌역</option><option value="37.5404,127.0692">건대입구역</option><option value="37.5714,126.9918">종로3가</option><option value="37.5927,127.0164">성신여대입구역</option><option value="37.2664,127.0001">수원역</option><option value="37.4563,126.7052">인천시청</option><option value="35.1578,129.06">부산 서면</option><option value="35.8693,128.5956">대구 동성로</option><option value="36.3326,127.4342">대전역</option><option value="35.1475,126.9156">광주 충장로</option></select>
</div>
<p id="locMsg" class="note" role="status"></p>
<button type="button" class="act" id="toFood">이 위치로 식당 보기</button>
</div>
</section>
<section id="step-food" hidden>
<div class="card">
<h2>식당</h2>
<p id="foodIntro" class="note"></p>
<label class="visit"><input type="checkbox" class="hide-visited"> 가본 곳 숨기기</label>
<div class="map-frame"><div id="map" role="application" aria-label="출발지와 식당 지도"></div></div>
<p id="mapMsg" class="note" hidden>지도 타일을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.</p>
<p class="map-attr">지도 © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 기여자</p>
</div>
<div id="foodList" class="list"></div>
</section>
<section id="step-after" hidden>
<div class="card">
<h2>식후</h2>
<p id="afterIntro" class="note"></p>
</div>
<div id="afterList"></div>
<div class="card" id="promoCard"></div>
</section>
<section id="step-course" hidden>
<div class="card">
<h2>코스</h2>
<p id="rainBanner" class="warn" hidden></p>
<p id="sunNote" class="note"></p>
<p id="weatherMsg" class="note" role="status"></p>
</div>
<div id="courseList" class="list"></div>
</section>
<section id="step-summary" hidden>
<div class="card summary">
<h2>오늘의 코스</h2>
<div id="summaryBody"></div>
<label for="shareUrl">공유 링크</label>
<input id="shareUrl" readonly>
<button type="button" class="act" id="copyLink">링크 복사</button>
<p id="copyMsg" class="note" role="status"></p>
</div>
</section>
</main>
<div class="dock" id="dock" hidden>
<button type="button" class="act" id="dockBack">뒤로</button>
</div>
</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script src="data.js"></script>
<script>
const PARTY_LABEL={"1":"1명 (혼밥)","2":"2명","3-4":"3~4명","5+":"5명 이상"};
const STEPS=[["party","인원"],["place","위치"],["food","식당"],["after","식후"],["course","코스"],["summary","요약"]];
const GEOERR={1:"위치 권한이 거부됐어요. 주소창 왼쪽 자물쇠(ⓘ) → 권한 → 위치를 '허용'으로 바꾸거나, 아래에 주소를 입력하세요. 출발지는 누리꿈스퀘어로 둡니다.",2:"현재 위치를 확인할 수 없어요(GPS/네트워크 위치 꺼짐). 휴대폰 설정에서 '위치'를 켜거나 주소를 입력하세요. 출발지는 누리꿈스퀘어로 둡니다.",3:"위치 확인 시간이 초과됐어요. 실내라면 잠시 후 다시 시도하거나 주소를 입력하세요. 출발지는 누리꿈스퀘어로 둡니다."};
const SOLO=new Set(["분식/김밥","면/라면","덮밥/돈가스","버거/샌드위치","초밥","한그릇/백반","패스트푸드","간편식"]);
const state={party:null,step:"party",origin:null,rest:null,after:null,course:null,rainy:false,weatherMsg:"",forceOutdoor:false,sangam:null,osmR:null,osmS:null};
let map,layer,SANGAM;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
function hav(a,b,c,d){const R=6371000,p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function walkMinFrom(m){return Math.max(1,Math.round(m*1.3/70))}
function kstParts(d=new Date()){
 const fmt=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
 const parts=Object.fromEntries(fmt.formatToParts(d).map(x=>[x.type,x.value]));
 const map={Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
 return {day:map[parts.weekday],minutes:(+parts.hour)*60+(+parts.minute)};
}
function kstDateKey(d=new Date()){
 return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
}
function dayAllowed(hours,day){
 if(/매일|24\s*시간|00:00\s*[-~]\s*24:00/.test(hours))return true;
 if(/주말\s*휴무/.test(hours)&&(day===0||day===6))return false;
 if(/일\s*[·,／]\s*월\s*휴관/.test(hours)&&(day===0||day===1))return false;
 if(/(?:일요일|일)\s*휴무(?!\s*여부)/.test(hours)&&day===0)return false;
 if(/(?:토요일|토)\s*휴무(?!\s*여부)/.test(hours)&&day===6)return false;
 if(/(?:월요일|월)\s*휴무(?!\s*여부)/.test(hours)&&day===1)return false;
 const names=["일","월","화","수","목","금","토"];
 const today=names[day];
 if(new RegExp(today+"요일?\\s*휴무").test(hours))return false;
 if(/평일/.test(hours)&&day>=1&&day<=5)return true;
 if(/주말/.test(hours)&&(day===0||day===6)&&!/주말\s*휴무/.test(hours))return true;
 const idx={일:0,월:1,화:2,수:3,목:4,금:5,토:6};
 let any=false,inside=false;
 for(const m of hours.matchAll(/([월화수목금토일])\s*[~～\-]\s*([월화수목금토일])/g)){
  any=true;const a=idx[m[1]],b=idx[m[2]];
  if(a<=b?day>=a&&day<=b:day>=a||day<=b)inside=true;
 }
 if(new RegExp(today+"\\s*\\d").test(hours))return true;
 if(any)return inside;
 return true;
}
function openStatus(hours){
 const h=hours||"";
 if(/24\s*시간|00:00\s*[-~]\s*24:00/.test(h))return {state:"open",text:"24시간"};
 const ranges=[...h.matchAll(/(\d{1,2}):(\d{2})\s*[-~～]\s*(\d{1,2}):(\d{2})/g)].map(m=>({a:+m[1]*60+(+m[2]),b:+m[3]*60+(+m[4])}));
 if(!ranges.length)return {state:"unknown",text:"영업시간 확인 필요"};
 const now=kstParts();
 if(!dayAllowed(h,now.day))return {state:"closed",text:"지금 영업 종료/확인 필요"};
 const bt=h.match(/BT\s*(\d{1,2})(?::(\d{2}))?\s*[-~～]\s*(\d{1,2})(?::(\d{2}))?/);
 if(bt){
  const a=+bt[1]*60+(+bt[2]||0),b=+bt[3]*60+(+bt[4]||0);
  if(now.minutes>=a&&now.minutes<b)return {state:"closed",text:"지금 영업 종료/확인 필요"};
 }
 const open=ranges.some(r=>r.b>=r.a?now.minutes>=r.a&&now.minutes<r.b:now.minutes>=r.a||now.minutes<r.b);
 return open?{state:"open",text:"지금 시간엔 영업 시간으로 보여요"}:{state:"closed",text:"지금 영업 종료/확인 필요"};
}
function sunsetMinutes(){
 const key=kstDateKey();
 const table=SANGAM.sunset||{};
 if(table[key]){const [h,m]=table[key].split(":");return +h*60+(+m)}
 const keys=Object.keys(table).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
 let best=keys[0],gap=1e15;
 for(const k of keys){const d=Math.abs(new Date(k)-new Date(key));if(d<gap){gap=d;best=k}}
 if(!best)return 17*60+16;
 const [h,m]=table[best].split(":");return +h*60+(+m);
}
function afterSunset(){return kstParts().minutes>=sunsetMinutes()}
function nearNuri(){return hav(state.origin.lat,state.origin.lng,SANGAM.origin.lat,SANGAM.origin.lng)<=1500}
function distOf(p,from){return Math.round(hav(from.lat,from.lng,p.lat,p.lng))}
function partyFitOsm(cat){
 if(cat==="푸드코트")return {sizes:["1","2","3-4"],label:"혼밥·소규모 추정"};
 if(SOLO.has(cat))return {sizes:["1","2"],label:"혼밥 추정"};
 return {sizes:["3-4","5+"],label:"단체 추정"};
}
function show(id){document.getElementById(id).hidden=false}
function hide(id){document.getElementById(id).hidden=true}
function renderSteps(){
 const nav=document.getElementById("steps");
 if(!state.party){nav.hidden=true;return}
 nav.hidden=false;
 const idx=STEPS.findIndex(s=>s[0]===state.step);
 nav.innerHTML=STEPS.map(([id,label],i)=>`<button type="button" data-goto="${id}" class="${id===state.step?"on":""}" ${i>idx?"disabled":""}>${label}</button>`).join("");
 nav.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{if(b.disabled)return;go(b.dataset.goto,false)});
}
function go(step,resetAfter){
 state.step=step;
 if(resetAfter){state.rest=null;state.after=null;state.course=null}
 ["party","place","food","after","course","summary","log"].forEach(s=>document.getElementById("step-"+s).hidden=s!==step);
 renderSteps();
 syncDock();
 if(step==="place")paintOrigin();
 if(step==="food")renderFood();
 if(step==="after")renderAfter();
 if(step==="course")renderCourse();
 if(step==="summary")renderSummary();
}
function paintOrigin(){
 document.getElementById("originLabel").textContent=`출발: ${state.origin.name} · ${state.origin.address||""} (${state.origin.lat.toFixed(4)}, ${state.origin.lng.toFixed(4)})`;
}
function setOrigin(lat,lng,name,address){
 state.origin={name,address:address||"",lat,lng};
 state.rest=null;state.after=null;state.course=null;state.forceOutdoor=false;
 paintOrigin();
}
document.getElementById("partyChoices").onclick=e=>{
 const b=e.target.closest("[data-party]");if(!b)return;
 state.party=b.dataset.party;
 state.rest=null;state.after=null;state.course=null;
 go("place");
};
document.getElementById("toFood").onclick=()=>go("food");
document.getElementById("dockBack").onclick=()=>{

document.getElementById("geo").onclick=()=>{

 if(!window.isSecureContext){msg.textContent="보안(https) 주소에서만 위치를 쓸 수 있어요. https:// 주소로 접속해 주세요. 출발지는 누리꿈스퀘어로 둡니다.";return}
 msg.textContent="현재 위치 확인 중… (최대 20초)";
 const ok=p=>{const acc=Math.round(p.coords.accuracy);setOrigin(p.coords.latitude,p.coords.longitude,"내 위치"+(Number.isFinite(acc)&&acc>0?`(±${acc}m)`:""),"");msg.textContent="내 위치로 맞췄어요.";};
 navigator.geolocation.getCurrentPosition(ok,e=>{
  if(e.code===1){msg.textContent=GEOERR[1];return}
  msg.textContent="정밀 위치 실패 → 대략적 위치로 다시 시도 중…";
  navigator.geolocation.getCurrentPosition(ok,e2=>{msg.textContent=(GEOERR[e2.code]||"위치 확인 실패")+" (코드 "+e2.code+")";},{enableHighAccuracy:false,timeout:15000,maximumAge:600000});
 },{enableHighAccuracy:true,timeout:8000,maximumAge:60000});
};
async function geocode(v){
 const nom=s=>fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=kr&accept-language=ko&limit=1&q="+encodeURIComponent(s)).then(r=>r.ok?r.json():[]).then(j=>j[0]&&[+j[0].lat,+j[0].lon,j[0].display_name.split(",").slice(0,3).join(",")]);
 const pho=s=>fetch("https://photon.komoot.io/api/?limit=1&lat=37.5665&lon=126.978&q="+encodeURIComponent(s)).then(r=>r.ok?r.json():{features:[]}).then(j=>{const f=j.features&&j.features[0];if(!f)return null;const p=f.properties;return [f.geometry.coordinates[1],f.geometry.coordinates[0],[p.name,p.district,p.city].filter(Boolean).join(", ")]});
 const s2=v.replace(/(로|길)\s*(\d+[가-힣]*길)/,"$1$2").replace(/\s+\d+(-\d+)?\s*$/,"");
 for(const f of [()=>nom(v),()=>pho(v),()=>nom(s2),()=>pho(s2),()=>nom("서울 "+s2)]){try{const r=await f();if(r)return r}catch(e){}}
 return null;
}
document.getElementById("addrBtn").onclick=async()=>{

 msg.textContent="주소 찾는 중…";

 setOrigin(g[0],g[1],g[2]||v,g[2]||"");msg.textContent="주소로 맞췄어요.";
};

const LOG_KEY="course-history-v1";
function emptyLog(){return {version:1,hideVisited:false,places:{}}}
function loadLog(){
 try{const j=JSON.parse(localStorage.getItem(LOG_KEY)||"");if(j&&j.places)return j}catch(e){}
 return emptyLog();
}
function saveLog(){localStorage.setItem(LOG_KEY,JSON.stringify(state.log))}
state.log=loadLog();
function placeId(p){
 if(p.src==="osm")return "osm:"+Number(p.lat).toFixed(5)+","+Number(p.lng).toFixed(5)+"|"+(p.name||"");
 return "c:"+(p.name||"")+"|"+(p.address||"");
}
function recOf(p){return state.log.places[placeId(p)]}
function isVisited(p){const r=recOf(p);return !!(r&&r.visited)}
function todayKst(){return kstDateKey()}
function ensureRec(p){
 const id=placeId(p);
 if(!state.log.places[id])state.log.places[id]={id,name:p.name||"",address:p.address||"",src:p.src||"sangam",lat:p.lat,lng:p.lng,type:p.type||"",visited:false,visitedAt:"",menus:[]};
 return state.log.places[id];
}
function setVisited(p,on){
 const r=ensureRec(p);
 r.visited=!!on;
 r.visitedAt=on?(r.visitedAt||todayKst()):"";
 if(!r.visited&&!(r.menus&&r.menus.length))delete state.log.places[r.id];
 saveLog();
}
function eatenMenus(p){const r=recOf(p);return r&&r.menus?r.menus.slice():[]}
function addMenu(p,name){
 const text=String(name||"").trim();
 if(!text)return;
 const r=ensureRec(p);
 if(!r.menus.includes(text))r.menus.push(text);
 if(!r.visited){r.visited=true;r.visitedAt=r.visitedAt||todayKst()}
 saveLog();
}
function removeMenu(p,name){
 const r=recOf(p);if(!r)return;
 r.menus=(r.menus||[]).filter(m=>m!==name);
 if(!r.visited&&!r.menus.length)delete state.log.places[r.id];
 saveLog();
}
function knownMenuItems(p){
 if(!p.priceNote||!p.notes)return [];
 const out=[];
 const re=/([가-힣A-Za-z][가-힣A-Za-z0-9·\s]{0,16}?)\s*(?:\d+\s*종\s*)?(?:\d+\s*g\s*)?(\d{1,3}(?:,\d{3})원)/g;
 for(const m of p.notes.matchAll(re)){
  let name=m[1].replace(/^.*[:：]/,"").trim().replace(/[,\s]+$/,"");
  if(!/[가-힣]/.test(name)||name.length<2||name.length>18)continue;
  if(/후기|기준|매장|좌석|룸|인석/.test(name))continue;
  if(!out.includes(name))out.push(name);
 }
 return out;
}
function arrange(list){
 const rows=list.slice().sort((a,b)=>{
  const av=isVisited(a)?1:0,bv=isVisited(b)?1:0;
  if(av!==bv)return av-bv;
  return a.d-b.d;
 });
 return state.log.hideVisited?rows.filter(p=>!isVisited(p)):rows;
}
function pin(cls,color,visited){return L.divIcon({className:"pin-wrap",html:`<span class="pin ${cls}${visited?" visited":""}" style="background:${color}"></span>`,iconSize:[22,22],iconAnchor:[11,11]})}
let tileOk=0,tileBad=0;
function refreshMap(){
 if(!map)return;
 const el=document.getElementById("map");
 if(!el||el.clientHeight<40)return;
 map.invalidateSize();
}
function ensureMap(){
 const el=document.getElementById("map");
 if(!el||el.clientHeight<40)return false;
 if(map){refreshMap();return true}
 map=L.map(el,{zoomControl:true}).setView([state.origin.lat,state.origin.lng],15);
 const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
 tiles.on("tileload",()=>{tileOk++;const msg=document.getElementById("mapMsg");if(msg)msg.hidden=true});
 tiles.on("tileerror",()=>{tileBad++;if(tileBad>=4&&tileOk===0){const msg=document.getElementById("mapMsg");if(msg)msg.hidden=false}});
 tiles.addTo(map);
 map.attributionControl.setPrefix(false);
 layer=L.layerGroup().addTo(map);
 refreshMap();
 return true;
}
function drawFoodMap(places){
 if(!ensureMap()){requestAnimationFrame(()=>drawFoodMap(places));return}
 layer.clearLayers();
 const o=state.origin;
 L.marker([o.lat,o.lng],{icon:pin("me","#15803d"),keyboard:false,title:"출발"}).addTo(layer);
 const bounds=[[o.lat,o.lng]];
 places.forEach(p=>{
  const m=L.marker([p.lat,p.lng],{icon:pin("place","#15803d",isVisited(p)),title:p.name,keyboard:true});
  m.on("click",()=>document.getElementById("p-"+encodeURIComponent(p.name))?.scrollIntoView({block:"nearest"}));
  m.addTo(layer);bounds.push([p.lat,p.lng]);
 });
 map.fitBounds(bounds,{padding:[20,20],maxZoom:16});
 refreshMap();
 setTimeout(refreshMap,80);
 setTimeout(refreshMap,300);
}
window.addEventListener("resize",()=>{if(state.step==="food")refreshMap()});
async function loadOsm(){
 if(!state.osmR){const r=await fetch("restaurants.json");const j=await r.json();state.osmR=j}
 if(!state.osmS){const r=await fetch("stores.json");const j=await r.json();state.osmS=j.s||[]}
}
async function restaurants(){
 if(nearNuri()){
  return arrange(SANGAM.places.filter(p=>p.type==="restaurant"&&p.partySizes.includes(state.party)).map(p=>({...p,d:distOf(p,state.origin),src:"sangam"})));
 }
 await loadOsm();
 const cats=state.osmR.cats||[];
 const out=[];
 for(const row of state.osmR.r){
  const cat=cats[row[2]]||"";
  const fit=partyFitOsm(cat);
  if(!fit.sizes.includes(state.party))continue;
  const d=Math.round(hav(state.origin.lat,state.origin.lng,row[0],row[1]));
  if(d>1500)continue;
  out.push({name:row[3],type:"restaurant",category:cat,lat:row[0],lng:row[1],hours:"",address:"",sourceUrl:"https://www.openstreetmap.org/copyright",notes:"",fitLabel:fit.label,d,src:"osm",walkMin:walkMinFrom(d)});
 }
 return arrange(out).slice(0,40);
}
function shortTag(p){
 if(p.fitLabel&&p.fitLabel.includes("단체"))return "단체석";
 if(p.fitLabel&&p.fitLabel.includes("혼밥"))return "혼밥 OK";
 const sizes=p.partySizes||[];
 if(sizes.includes("5+")||(sizes.includes("3-4")&&!sizes.includes("1")))return "단체석";
 if(sizes.includes("1"))return "혼밥 OK";
 return "";
}
function placeCard(p,buttonLabel){
 const st=openStatus(p.hours);
 const walk=p.src==="sangam"&&hav(state.origin.lat,state.origin.lng,SANGAM.origin.lat,SANGAM.origin.lng)<200?p.walkMin:walkMinFrom(p.d);
 const tag=shortTag(p);
 const price=p.priceNote?`<p class="note">가격 메모: ${esc(p.priceNote)}. 메뉴 전체가 아닙니다.</p>`:"";
 const id="p-"+encodeURIComponent(p.name);
 return `<article class="card place${isVisited(p)?" visited":""}" id="${id}" data-name="${esc(p.name)}" data-id="${esc(placeId(p))}">
  <h3>${esc(p.name)}</h3>
  <p class="meta">${esc(p.category||"식당")} · 도보 약 ${walk}분</p>
  ${tag?`<div class="badges"><span class="badge">${esc(tag)}</span></div>`:""}
  <details class="more"><summary>자세히</summary>
  <p class="note">${esc(st.text)}</p>
  ${p.hours?`<p class="note">${esc(p.hours)}</p>`:""}
  ${p.address?`<p class="addr">${esc(p.address)}</p>`:""}
  ${p.notes?`<p class="note">${esc(p.notes)}</p>`:""}
  ${p.latlngNote?`<p class="note">${esc(p.latlngNote)}</p>`:""}
  ${price}
  ${p.sourceUrl?`<p><a href="${esc(p.sourceUrl)}" target="_blank" rel="noopener">출처</a></p>`:""}
  ${visitBlock(p)}
  </details>
  <button type="button" class="act pick">${esc(buttonLabel)}</button>
 </article>`;
}
function visitBlock(p){
 const id=placeId(p);
 const rec=recOf(p);
 const visited=!!(rec&&rec.visited);
 const ate=(rec&&rec.menus)||[];
 const badge=visited?`<span class="badge est">가본 곳 ${esc(rec.visitedAt||"")}</span>`:"";
 const known=(p.type==="restaurant"||!p.type)?knownMenuItems(p):[];
 const knownHtml=known.map(name=>`<label class="known-menu"><input type="checkbox" class="ate-known" data-id="${esc(id)}" data-menu="${esc(name)}" ${ate.includes(name)?"checked":""}> ${esc(name)} <span class="note">자료에 적힌 메뉴</span></label>`).join("");
 const chips=ate.map(name=>`<span class="chip">${esc(name)} <button type="button" class="menu-x" data-id="${esc(id)}" data-menu="${esc(name)}" aria-label="${esc(name)} 삭제">×</button></span>`).join("");
 const editor=(p.type==="restaurant"||!p.type)?`<div class="menu-row"><input class="menu-input" data-id="${esc(id)}" aria-label="먹은 메뉴" placeholder="먹은 메뉴 이름"><button type="button" class="ghost menu-add" data-id="${esc(id)}">추가</button></div><div class="chips">${chips}</div>`:"";
 return `<label class="visit"><input type="checkbox" class="visited-toggle" data-id="${esc(id)}" ${visited?"checked":""}> 가봤어요</label>${badge}${knownHtml}${editor}`;
}
function bindVisit(root,list,rerender){
 root.querySelectorAll(".visited-toggle").forEach(el=>el.onchange=()=>{
  const p=list.find(x=>placeId(x)===el.dataset.id);if(!p)return;
  setVisited(p,el.checked);rerender();
 });
 root.querySelectorAll(".ate-known").forEach(el=>el.onchange=()=>{
  const p=list.find(x=>placeId(x)===el.dataset.id);if(!p)return;
  if(el.checked)addMenu(p,el.dataset.menu);else removeMenu(p,el.dataset.menu);
  rerender();
 });
 root.querySelectorAll(".menu-add").forEach(el=>el.onclick=()=>{
  const p=list.find(x=>placeId(x)===el.dataset.id);if(!p)return;
  const input=el.parentElement.querySelector(".menu-input");
  addMenu(p,input.value);rerender();
 });
 root.querySelectorAll(".menu-input").forEach(el=>el.onkeydown=e=>{
  if(e.key!=="Enter")return;
  e.preventDefault();
  const p=list.find(x=>placeId(x)===el.dataset.id);if(!p)return;
  addMenu(p,el.value);rerender();
 });
 root.querySelectorAll(".menu-x").forEach(el=>el.onclick=()=>{
  const p=list.find(x=>placeId(x)===el.dataset.id);if(!p)return;
  removeMenu(p,el.dataset.menu);rerender();
 });
}
function windowed(list){
 const fresh=list.filter(p=>!isVisited(p));
 const old=state.log.hideVisited?[]:list.filter(isVisited);
 const n=state.listMore||8;
 return {shown:fresh.slice(0,n).concat(old),more:fresh.length>n};
}

 const root=document.getElementById("foodList");
 root.innerHTML=view.shown.map(p=>placeCard(p,"여기로 정하기")).join("")||`<div class="card">이 인원에 맞는 식당이 없어요.</div>`;
 if(view.more)root.insertAdjacentHTML("beforeend",`<button type="button" class="ghost" id="moreFood">더 보기</button>`);
 root.querySelectorAll(".pick").forEach((b,i)=>b.onclick=()=>{state.rest=view.shown[i];state.after=null;state.course=null;go("after")});

function pairRule(rest){
 const s=`${rest.name} ${rest.category||""}`;
 if(/떡볶이|마라|짬뽕|매운|엽기|불닭|라볶이/.test(s))return {genres:["우유/두유","차","생수"],why:"매운 음식 이름이라 우유·차·생수를 골랐습니다. 매운맛을 낮춘다는 뜻이 아니라 같이 고르기 쉬운 조합입니다."};
 if(/버거|햄버거|맥도날/.test(s))return {genres:["탄산","커피"],why:"버거에는 탄산·커피를 맞췄습니다. 건강 효과가 아닙니다."};
 if(/라면|라멘|국수|쌀국수|우동|면/.test(s))return {genres:["생수","차","우유/두유"],why:"면 요리에는 생수·차·우유를 맞췄습니다. 건강 효과가 아닙니다."};
 if(/김밥|분식/.test(s))return {genres:["우유/두유","차","탄산"],why:"분식·김밥에는 우유·차·탄산을 맞췄습니다. 건강 효과가 아닙니다."};
 if(/덮밥|샤브|곰탕|국밥|한식|두부/.test(s))return {genres:["탄산","차","생수"],why:"밥·국물에는 탄산·차·생수를 맞췄습니다. 건강 효과가 아닙니다."};
 if(/파스타|피자|양식|이탈리|핀사/.test(s))return {genres:["탄산","커피"],why:"양식에는 탄산·커피를 맞췄습니다. 건강 효과가 아닙니다."};
 return {genres:["생수","차","탄산"],why:"종류를 더 좁히지 못해 생수·차·탄산을 골랐습니다. 건강 효과가 아닙니다."};
}
function promoItems(rule){
 const data=window.DRINK_DATA;
 if(!data||!data.items)return [];
 const out=[];
 for(const g of rule.genres){
  const rows=data.items.filter(x=>x.genre===g&&(x.chain==="CU"||x.chain==="emart24")).sort((a,b)=>(a.price??1e9)-(b.price??1e9));
  for(const x of rows){if(out.filter(p=>p.genre===g).length>=2)break;if(!out.some(p=>p.name===x.name&&p.chain===x.chain&&p.promo===x.promo))out.push(x)}
 }
 return out.slice(0,6);
}

  items.map(x=>`<div class="drink" data-name="${esc(x.name)}" data-price="${x.price??""}" data-promo="${esc(x.promo)}" data-genre="${esc(x.genre)}" data-chain="${esc(x.chain)}"><b>${esc(x.chain)}</b> ${esc(x.promo)} · ${esc(x.genre)}<br>${esc(x.name)}<br>${x.price!=null?x.price.toLocaleString()+"원":"가격 정보 없음"}</div>`).join("");
}
function capGroup(rows){
 const ordered=rows.slice().sort((a,b)=>a.d-b.d);
 const fresh=ordered.filter(p=>!isVisited(p));
 const old=state.log.hideVisited?[]:ordered.filter(isVisited);
 const n=state.afterMore||8;
 return {rows:fresh.slice(0,n).concat(old),more:fresh.length>n};
}
function syncHide(){document.querySelectorAll(".hide-visited").forEach(el=>{el.checked=!!state.log.hideVisited})}
function renderLog(){
 const rows=Object.values(state.log.places).filter(p=>p.visited||(p.menus&&p.menus.length)).sort((a,b)=>(b.visitedAt||"").localeCompare(a.visitedAt||"")||a.name.localeCompare(b.name,"ko"));
 document.getElementById("logList").innerHTML=rows.length?rows.map(p=>`<article class="card" data-id="${esc(p.id)}"><h3>${esc(p.name)}</h3><p class="note">${p.visited?`가본 곳 ${esc(p.visitedAt||"")}`:"방문 체크는 꺼져 있음"}</p><p class="note">${(p.menus||[]).length?`먹은 메뉴: ${p.menus.map(esc).join(", ")}`:"먹은 메뉴 없음"}</p>${p.visited?`<button type="button" class="ghost unvisit" data-id="${esc(p.id)}">가봤어요 해제</button>`:""}</article>`).join(""):`<p class="note">아직 기록이 없어요.</p>`;
 document.getElementById("logList").querySelectorAll(".unvisit").forEach(b=>b.onclick=()=>{
  const r=state.log.places[b.dataset.id];if(!r)return;
  r.visited=false;r.visitedAt="";
  if(!(r.menus&&r.menus.length))delete state.log.places[r.id];
  saveLog();renderLog();
 });
 syncHide();
}
document.getElementById("openLog").onclick=()=>{state.returnStep=state.step;go("log");renderLog()};
document.querySelectorAll(".hide-visited").forEach(el=>el.onchange=()=>{
 state.log.hideVisited=el.checked;saveLog();syncHide();
 if(state.step==="food")renderFood();
 if(state.step==="after")renderAfter();
 if(state.step==="log")renderLog();
});
document.getElementById("exportBtn").onclick=()=>{
 const payload={version:1,exportedAt:new Date().toISOString(),hideVisited:!!state.log.hideVisited,places:state.log.places};
 document.getElementById("transferJson").value=JSON.stringify(payload,null,2);
 document.getElementById("transferMsg").textContent="아래 JSON을 복사하거나 파일로 저장하세요.";
 const blob=new Blob([document.getElementById("transferJson").value],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="course-history.json";a.click();
 URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>{
 try{
  const j=JSON.parse(document.getElementById("transferJson").value);
  if(!j||typeof j.places!=="object")throw new Error("형식");
  state.log={version:1,hideVisited:!!j.hideVisited,places:j.places};
  saveLog();
  document.getElementById("transferMsg").textContent="기록을 가져왔어요.";
  renderLog();
 }catch(e){document.getElementById("transferMsg").textContent="JSON을 읽지 못했어요.";}
};
function courseItems(){
 const rainy=state.rainy&&!state.forceOutdoor;
 let routes=SANGAM.routes.filter(r=>r.partySizes.includes(state.party)&&(rainy?r.rainy:!r.rainy));
 if(!rainy&&afterSunset()){
  const night=["R1","R2","R5"];
  routes=routes.slice().sort((a,b)=>{
   const s=r=>r.id==="R3"?9:night.includes(r.id)?night.indexOf(r.id):5;
   return s(a)-s(b);
  });
 }
 const extras=rainy?SANGAM.places.filter(p=>(p.type==="indoor"||p.type==="activity")&&p.partySizes.includes(state.party)):SANGAM.places.filter(p=>p.type==="activity"&&p.partySizes.includes(state.party));
 return {routes,extras};
}
async function loadWeather(){
 const o=state.origin;
 const url=`https://api.open-meteo.com/v1/forecast?latitude=${o.lat}&longitude=${o.lng}&current=precipitation,weather_code&hourly=precipitation,precipitation_probability,weather_code&forecast_hours=6&timezone=Asia%2FSeoul`;
 try{
  const r=await fetch(url);if(!r.ok)throw new Error(r.status);
  const j=await r.json();
  const code=j.current&&j.current.weather_code;
  const prec=j.current&&j.current.precipitation;
  const hourly=j.hourly||{};
  const probs=hourly.precipitation_probability||[];
  const precs=hourly.precipitation||[];
  const codes=hourly.weather_code||[];
  const wetCode=c=>[51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86,95,96,99].includes(c);
  const likely=(prec>0)||wetCode(code)||probs.slice(0,4).some(n=>n>=50)||precs.slice(0,4).some(n=>n>0)||codes.slice(0,4).some(wetCode);
  state.rainy=!!likely;
  state.weatherMsg=likely?"앞으로 몇 시간 안에 비나 눈이 올 가능성이 있습니다.":"지금은 비·눈 예보가 약합니다.";
 }catch(e){
  state.rainy=false;
  state.weatherMsg="날씨를 불러오지 못했어요. 야외 코스를 보여 줍니다.";
 }
}
async function renderCourse(){
 document.getElementById("weatherMsg").textContent="날씨 확인 중…";
 await loadWeather();
 document.getElementById("weatherMsg").textContent=state.weatherMsg;
 const banner=document.getElementById("rainBanner");
 if(state.rainy){
  banner.hidden=false;
  banner.innerHTML=`비 예보가 있어 실내 코스로 바꿨어요. <button type="button" class="act" id="rainToggle">${state.forceOutdoor?"실내 코스로 돌아가기":"야외 코스 보기"}</button>`;
  document.getElementById("rainToggle").onclick=()=>{state.forceOutdoor=!state.forceOutdoor;renderCourse()};
 }else banner.hidden=true;
 const sun=document.getElementById("sunNote");
 sun.textContent=!state.rainy&&afterSunset()?"해 진 뒤라 하늘공원 코스는 뒤로 뺐어요. 야간에는 DMC 야경, 평화의공원, 불광천을 먼저 둡니다.":"";
 if(!nearNuri()){
  document.getElementById("courseList").innerHTML=`<div class="card">산책·액티비티 코스는 상암 조사 자료라, 누리꿈스퀘어에서 1.5km 넘으면 보여 주지 않습니다.</div>`;
  return;
 }
 const {routes,extras}=courseItems();
 const routeHtml=routes.map(r=>{
  const late=r.id==="R3"&&afterSunset();
  return `<article class="card" data-course="${esc(r.id)}"><h3>${esc(r.name)}</h3><p class="meta">${r.distanceKm}km · 약 ${r.durationMin}분 <span class="badge est">추정</span></p><p class="note">${esc(r.bestTime||"")}</p><p class="note">${(r.stops||[]).map(esc).join(" → ")}</p>${late?`<p class="badge closed">저녁에는 하늘공원을 뒤로 뺐어요</p>`:""}<p class="note">${esc(r.notes||"")}</p><p><a href="${esc(r.sourceUrl)}" target="_blank" rel="noopener">출처</a></p><button type="button" class="act pick">이 코스로</button></article>`;
 }).join("");
 const extraHtml=extras.map(p=>{
  const d=distOf(p,state.rest||state.origin);
  const item={...p,d,src:"sangam"};
  return placeCard(item,"이 코스로");
 }).join("");
 const box=document.getElementById("courseList");
 box.innerHTML=(routeHtml||"")+extraHtml||`<div class="card">이 인원의 코스가 없어요.</div>`;
 const routeBtns=[...box.querySelectorAll("[data-course] .pick")];
 routeBtns.forEach((b,i)=>b.onclick=()=>{state.course={...routes[i],kind:"route"};go("summary")});
 const extraBtns=[...box.querySelectorAll(".place .pick")];
 extraBtns.forEach((b,i)=>b.onclick=()=>{state.course={...extras[i],kind:"place"};go("summary")});
}
function renderSummary(){
 const rest=state.rest,after=state.after,course=state.course;
 const rw=rest?(rest.src==="osm"?walkMinFrom(rest.d):(hav(state.origin.lat,state.origin.lng,SANGAM.origin.lat,SANGAM.origin.lng)<200?rest.walkMin:walkMinFrom(distOf(rest,state.origin)))):"-";
 const aw=after?walkMinFrom(distOf(after,rest)):"-";
 const cw=course?(course.durationMin||course.walkMin||walkMinFrom(distOf(course,after||rest))):"-";
 document.getElementById("summaryBody").innerHTML=`
  <p class="meta">${esc(PARTY_LABEL[state.party])} · 출발 ${esc(state.origin.name)}</p>
  <h3>식당</h3><p>${esc(rest.name)} · 출발지에서 도보 약 ${rw}분 <span class="badge est">추정</span></p>
  <h3>식후</h3><p>${esc(after.name)} · 식당에서 도보 약 ${aw}분 <span class="badge est">추정</span></p>
  <h3>산책/액티비티</h3><p>${esc(course.name)} · 약 ${cw}분 <span class="badge est">추정</span></p>
  <p class="note">${esc(SANGAM.walkMinNote)}</p>`;
 const url=shareUrl();
 document.getElementById("shareUrl").value=url;
 history.replaceState(null,"",url);
}
function shareUrl(){
 const q=new URLSearchParams({party:state.party,lat:state.origin.lat,lng:state.origin.lng,oname:state.origin.name,rest:state.rest&&state.rest.name||"",after:state.after&&state.after.name||"",course:(state.course&&(state.course.id||state.course.name))||""});
 return location.origin+location.pathname+"#"+q.toString();
}
document.getElementById("copyLink").onclick=async()=>{
 const url=document.getElementById("shareUrl").value;
 let ok=false;
 try{await navigator.clipboard.writeText(url);ok=true}catch(e){
  const el=document.getElementById("shareUrl");el.focus();el.select();
  try{ok=document.execCommand("copy")}catch(err){ok=false}
 }
 document.getElementById("copyMsg").textContent=ok?"링크를 복사했어요.":"아래 링크를 길게 눌러 복사해 주세요.";
};
function findByName(name){return SANGAM.places.find(p=>p.name===name)||SANGAM.routes.find(r=>r.id===name||r.name===name)}
function restoreHash(){
 const raw=location.hash.replace(/^#/,"");if(!raw)return;
 const q=new URLSearchParams(raw);
 if(!q.get("party"))return;
 state.party=q.get("party");
 const lat=+q.get("lat"),lng=+q.get("lng");
 if(Number.isFinite(lat)&&Number.isFinite(lng))state.origin={name:q.get("oname")||"출발",address:"",lat,lng};
 const rest=SANGAM.places.find(p=>p.name===q.get("rest"));
 const after=SANGAM.places.find(p=>p.name===q.get("after"));
 const course=SANGAM.routes.find(r=>r.id===q.get("course"))||SANGAM.places.find(p=>p.name===q.get("course"));
 if(rest)state.rest={...rest,d:distOf(rest,state.origin),src:"sangam"};
 if(after)state.after={...after,d:distOf(after,state.rest||state.origin),src:"sangam"};
 if(course)state.course={...course,kind:course.id?"route":"place"};
 if(state.rest&&state.after&&state.course)go("summary");
 else if(state.party)go("place");
}
async function boot(){
 const r=await fetch("data/sangam.json");
 SANGAM=await r.json();
 state.origin={...SANGAM.origin};
 if(!window.DRINK_DATA){try{window.DRINK_DATA=await (await fetch("data.json")).json()}catch(e){}}
 paintOrigin();
 restoreHash();
}
boot();
</script>
</body>
